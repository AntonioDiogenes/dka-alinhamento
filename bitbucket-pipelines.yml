# Bitbucket Pipelines - DKA Alinhamento
# Gera builds automáticas em paralelo para Linux (.tar.gz) e Windows (.exe)

image: python:3.11

pipelines:
  default:
    - parallel:
        - step:
            name: Build Linux (x86_64)
            caches:
              - pip
            script:
              - apt-get update && apt-get install -y python3-tk libtk8.6 libsqlite3-dev
              - python -m pip install --upgrade pip
              - pip install -r requirements.txt pyinstaller
              - python -m unittest discover tests
              - pyinstaller --noconfirm DKA_Alinhamento.spec
              - chmod +x dist/DKA_Alinhamento
              - tar -czf dist/DKA_Alinhamento-Linux-x64.tar.gz -C dist DKA_Alinhamento
            artifacts:
              - dist/DKA_Alinhamento-Linux-x64.tar.gz

        - step:
            name: Build Windows (.exe via Wine)
            image: cdrx/pyinstaller-windows:python3
            script:
              - pip install -r requirements.txt
              - pyinstaller --noconfirm DKA_Alinhamento.spec
              - mv dist/windows/DKA_Alinhamento.exe dist/DKA_Alinhamento-Windows-x64.exe || mv dist/DKA_Alinhamento.exe dist/DKA_Alinhamento-Windows-x64.exe || true
            artifacts:
              - dist/DKA_Alinhamento-Windows-x64.exe

  branches:
    main:
      - parallel:
          - step:
              name: Build Linux (x86_64)
              caches:
                - pip
              script:
                - apt-get update && apt-get install -y python3-tk libtk8.6 libsqlite3-dev
                - python -m pip install --upgrade pip
                - pip install -r requirements.txt pyinstaller
                - python -m unittest discover tests
                - pyinstaller --noconfirm DKA_Alinhamento.spec
                - chmod +x dist/DKA_Alinhamento
                - tar -czf dist/DKA_Alinhamento-Linux-x64.tar.gz -C dist DKA_Alinhamento
              artifacts:
                - dist/DKA_Alinhamento-Linux-x64.tar.gz

          - step:
              name: Build Windows (.exe via Wine)
              image: cdrx/pyinstaller-windows:python3
              script:
                - pip install -r requirements.txt
                - pyinstaller --noconfirm DKA_Alinhamento.spec
                - mv dist/windows/DKA_Alinhamento.exe dist/DKA_Alinhamento-Windows-x64.exe || mv dist/DKA_Alinhamento.exe dist/DKA_Alinhamento-Windows-x64.exe || true
              artifacts:
                - dist/DKA_Alinhamento-Windows-x64.exe

  tags:
    'v*':
      - parallel:
          - step:
              name: Release Build Linux
              caches:
                - pip
              script:
                - apt-get update && apt-get install -y python3-tk libtk8.6 libsqlite3-dev
                - python -m pip install --upgrade pip
                - pip install -r requirements.txt pyinstaller
                - python -m unittest discover tests
                - pyinstaller --noconfirm DKA_Alinhamento.spec
                - chmod +x dist/DKA_Alinhamento
                - tar -czf dist/DKA_Alinhamento-Linux-x64.tar.gz -C dist DKA_Alinhamento
                - |
                  if [ -n "$BITBUCKET_APP_PASSWORD" ]; then
                    curl -s -X POST "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}/downloads" \
                      --user "${BITBUCKET_USERNAME}:${BITBUCKET_APP_PASSWORD}" \
                      -F files=@dist/DKA_Alinhamento-Linux-x64.tar.gz
                  fi
              artifacts:
                - dist/DKA_Alinhamento-Linux-x64.tar.gz

          - step:
              name: Release Build Windows (.exe)
              image: cdrx/pyinstaller-windows:python3
              script:
                - pip install -r requirements.txt
                - pyinstaller --noconfirm DKA_Alinhamento.spec
                - mv dist/windows/DKA_Alinhamento.exe dist/DKA_Alinhamento-Windows-x64.exe || mv dist/DKA_Alinhamento.exe dist/DKA_Alinhamento-Windows-x64.exe || true
                - |
                  if [ -n "$BITBUCKET_APP_PASSWORD" ]; then
                    curl -s -X POST "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}/downloads" \
                      --user "${BITBUCKET_USERNAME}:${BITBUCKET_APP_PASSWORD}" \
                      -F files=@dist/DKA_Alinhamento-Windows-x64.exe
                  fi
              artifacts:
                - dist/DKA_Alinhamento-Windows-x64.exe
